{% load static %}
<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}EcoTech{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/ecotech.css' %}"></head>
<body class="auth-body"><main class="auth-shell"><section class="auth-brand"><div><div class="auth-logo"><img class="auth-logo-image" src="{% static 'images/ecotech-logo.png' %}" alt="EcoTech"></div><h1>Plataforma Inteligente para Gestão de <b>Resíduos Eletroeletrônicos</b></h1><div class="auth-rule"></div><p>Conectamos pessoas, empresas e instituições a soluções sustentáveis para o descarte correto de resíduos eletrônicos.</p></div><div class="auth-art"><i class="bi bi-laptop"></i><i class="bi bi-phone"></i><i class="bi bi-recycle"></i></div></section><section class="auth-content">{% block content %}{% endblock %}</section></main></body></html>
