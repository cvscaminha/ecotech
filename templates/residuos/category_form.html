{% extends 'base.html' %}
{% block content %}
<section class="eco-panel form-panel">
<h1>{{title}}</h1>
<form method="post">
{% csrf_token %}
{% for field in form %}
<div class="mb-3">
{% if field.name == 'active' %}
<div class="form-check d-flex align-items-center gap-2">
{{ field }}
<label class="form-check-label" for="{{ field.id_for_label }}">Ativo</label>
</div>
{% else %}
<label class="form-label">{{field.label}} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
{{field}}
{% endif %}
{% for e in field.errors %}<div class="text-danger">{{e}}</div>{% endfor %}
</div>
{% endfor %}
<button class="btn btn-eco">Salvar</button>
</form>
</section>
{% endblock %}
